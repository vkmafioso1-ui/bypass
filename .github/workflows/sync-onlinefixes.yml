name: Sincronizar Online Fix JSON

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  release:
    types: [published, edited, released]

permissions:
  contents: write

concurrency:
  group: onlinefixes-json-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Atualizar onlinefixes.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/sync_onlinefixes.py
      - name: Commitar apenas se houver novos jogos
        run: |
          if git diff --quiet -- onlinefixes.json; then
            echo "Nenhum novo jogo para adicionar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onlinefixes.json
          git commit -m "Atualizar onlinefixes.json com ZIPs da release online"
          git pull --rebase origin main
          git push origin HEAD:main
